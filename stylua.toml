# Maximum line length before wrapping
column_width = 120

# Line ending style: "Unix" (LF) or "Windows" (CRLF)
line_endings = "Unix"

# Indentation style: "Spaces" or "Tabs"
indent_type = "Spaces"

# Number of spaces per indentation level (ignored if indent_type is "Tabs")
indent_width = 2

# Quote preference: "AutoPreferDouble", "AutoPreferSingle", "ForceDouble", "ForceSingle"
quote_style = "AutoPreferDouble"

# Whether parentheses around single-argument function calls should be kept or removed
# Options: "Always", "NoSingleString", "NoSingleTable", "None", "Input"
call_parentheses = "Always"

# Collapse simple single-line statements
# Options: "Never", "FunctionOnly", "ConditionalOnly", "Always"
collapse_simple_statement = "Never"

# Automatically sort require(...) calls alphabetically (StyLua >= 0.17)
[sort_requires]
enabled = false

